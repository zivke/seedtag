org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP never downloads SDK packages by itself: everything it builds with is installed and hashed in the
# Dockerfile, and a missing package fails the build instead of arriving unseen, in CI too (board B33).
android.builder.sdkDownload=false
kotlin.code.style=official
# With testOptions' includeAndroidResources in app/build.gradle.kts: AGP 9.5's Compose Preview task, which an IDE
# creates for every variant, also needs release to have unit tests configured. None exist; nothing is built for them.
android.onlyEnableUnitTestForTheTestedBuildType=false
