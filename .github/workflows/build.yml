#
# Tests and builds the unsigned release APK in the dev container's own image (same pinned base image,
# Android SDK and JDK), on a machine that has nothing to do with the dev container. Its SHA-256 is the
# independent build that tools/sign-release.sh --expect compares against before signing.
# No secrets are used: nothing here can sign anything.
# It runs only for release tags (vX.Y.Z) and when started by hand (Actions tab, or
# `gh workflow run build.yml --ref <branch-or-tag>`).
name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The dev container only has argon2-cffi; this tests the backend the README tells users to
      # install. Hash-pinned (tools/requirements-ci.txt), and a skipped backend fails the run. Also
      # the slow test: decrypting with the built-in Argon2id and AES-GCM, no package at all.
      - name: seedtag.py with the cryptography package
        run: |
          python3 -m pip install --require-hashes --only-binary :all: --target "$RUNNER_TEMP/py" -r tools/requirements-ci.txt
          PYTHONPATH="$RUNNER_TEMP/py" SEEDTAG_REQUIRE_BACKENDS=cryptography SEEDTAG_SLOW_TESTS=1 python3 tools/test_seedtag.py

      - name: Build the dev container image
        run: docker build -t seedtag-dev .devcontainer

      - name: Test and build the unsigned release APK
        run: |
          # The image's user (vscode, uid 1000) builds; the checkout belongs to the runner's user.
          chmod -R a+rwX .
          docker run --rm -v "$PWD:/src" -w /src seedtag-dev make test build

      - name: SHA-256
        run: |
          sum="$(sha256sum seedtag-unsigned.apk | cut -d' ' -f1)"
          echo "$sum  seedtag-unsigned.apk" | tee seedtag-unsigned.apk.sha256
          {
            echo "### seedtag-unsigned.apk"
            echo
            echo "Commit \`$GITHUB_SHA\`, SHA-256:"
            echo
            echo "\`$sum\`"
            echo
            echo "Sign only if your own build matches: \`tools/sign-release.sh --expect $sum <keystore>\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seedtag-unsigned-${{ github.sha }}
          path: |
            seedtag-unsigned.apk
            seedtag-unsigned.apk.sha256
          if-no-files-found: error
