#
# Tests only, on every branch push (board B37), so a Kotlin/Python parity break shows up when it's pushed, not at
# release time. Nothing is built for release and nothing is uploaded; release tags are build.yml's.
# The core and seedtag.py run in the dev container's own image (make test, make test-cross), and seedtag.py again
# with the cryptography package (hash-pinned), on the runner's python3 and on the newest Python it has.
name: test

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: seedtag.py with the cryptography package
        run: |
          python3 -m pip install --require-hashes --only-binary :all: --target "$RUNNER_TEMP/py" -r tools/requirements-ci.txt
          PYTHONPATH="$RUNNER_TEMP/py" SEEDTAG_REQUIRE_BACKENDS=cryptography python3 -W error tools/test_seedtag.py

      # Board B10: a newer Python may deprecate what seedtag.py uses; -W error turns that into a failure. The
      # newest Python in the runner's tool cache (no extra action), with the same hash-pinned packages; if they
      # have no wheel for it yet, a warning instead (that's not seedtag.py's fault).
      - name: seedtag.py on the newest Python in the runner's tool cache
        run: |
          py="$(ls -d /opt/hostedtoolcache/Python/3.*/x64 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$py" ]; then echo "::warning::no Python in the runner's tool cache; skipped"; exit 0; fi
          "$py/bin/python3" --version
          if ! "$py/bin/python3" -m pip install --require-hashes --only-binary :all: --target "$RUNNER_TEMP/py-new" -r tools/requirements-ci.txt; then
            echo "::warning::the pinned packages don't install on $("$py/bin/python3" --version); skipped"; exit 0
          fi
          PYTHONPATH="$RUNNER_TEMP/py-new" SEEDTAG_REQUIRE_BACKENDS=cryptography "$py/bin/python3" -W error tools/test_seedtag.py

      - name: Build the dev container image
        run: docker build -t seedtag-dev .devcontainer

      - name: make test and make test-cross
        run: |
          # The image's user (vscode, uid 1000) runs it; the checkout belongs to the runner's user.
          chmod -R a+rwX .
          docker run --rm -v "$PWD:/src" -w /src seedtag-dev make test test-cross
